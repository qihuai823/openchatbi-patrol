version: 1
database: example_ecommerce/ecommerce.sqlite

# 演示用完整计划：覆盖全部分类 / 渠道 / 州 / 订单状态，约 85 个指标。
# 跑一轮的时间足够长，方便人为 Ctrl+C 中断后再用 --resume 接着跑。
# 与 patrol_plan.yaml 的差别只有规模：口径、阈值、去重规则完全一致。

defaults:
  history_points: 35
  min_samples: 14
  min_relative_change: 0.08
  cooldown_hours: 24
  min_severity: medium
  escalate: true
  weekday_aware: true

metrics:
  - name: gmv
    label: 成交总额 GMV
    direction: both
    sql: |
      SELECT date(o.date_order_placed) AS bucket,
             SUM(oi.line_amount) AS value
      FROM Orders o
      JOIN Order_Items oi ON oi.order_id = o.order_id
      WHERE o.order_status != 'Canceled'
      GROUP BY 1
      ORDER BY 1

  - name: order_count
    label: 有效订单量
    direction: drop
    min_relative_change: 0.12
    sql: |
      SELECT date(date_order_placed) AS bucket,
             COUNT(*) AS value
      FROM Orders
      WHERE order_status != 'Canceled'
      GROUP BY 1
      ORDER BY 1

  - name: gmv_cat_beauty
    label: GMV · beauty
    direction: drop
    sql: |
      SELECT date(o.date_order_placed) AS bucket,
             SUM(oi.line_amount) AS value
      FROM Orders o
      JOIN Order_Items oi ON oi.order_id = o.order_id
      JOIN Products p ON p.product_id = oi.product_id
      WHERE o.order_status != 'Canceled'
        AND p.category = 'beauty'
      GROUP BY 1
      ORDER BY 1

